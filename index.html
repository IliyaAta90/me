<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت تستی ایلیاجون</title>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 50px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #0078d7;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #0078d7;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>سلام ایلیاجون 👋</h1>
        <p>اگر این صفحه را می‌بینی یعنی GitHub Pages درست کار می‌کند.</p>

        <button onclick="showMessage()">
            کلیک کن
        </button>

        <p id="result"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("result").innerText =
                "🎉 جاوااسکریپت هم درست کار می‌کند!";
        }
    </script>

</body>
</html>
